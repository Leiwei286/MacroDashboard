<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宏观数据看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
      <div>
        <p class="mb-2 text-sm font-medium tracking-widest text-amber-400">MACRO DASHBOARD</p>
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">宏观数据看板</h1>
        <p class="mt-2 text-slate-400">每日自动更新 · 数据来源 Yahoo Finance</p>
      </div>
      <p id="update-time" class="text-sm text-slate-500">正在加载数据…</p>
    </header>

    <section class="grid gap-5 md:grid-cols-2">
      <article class="rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-xl">
        <p class="text-sm text-slate-400">最新金铜比</p>
        <div class="mt-3 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p id="gold-copper-latest-value" class="text-4xl font-bold text-amber-400">—</p>
            <p id="gold-copper-latest-date" class="mt-2 text-sm text-slate-500">—</p>
          </div>
          <div id="gold-copper-changes" class="grid grid-cols-2 gap-x-5 gap-y-3 text-sm"></div>
        </div>
      </article>
      <article class="rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-xl">
        <p class="text-sm text-slate-400">最新美元兑日元</p>
        <div class="mt-3 flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p id="usd-jpy-latest-value" class="text-4xl font-bold text-sky-400">—</p>
            <p id="usd-jpy-latest-date" class="mt-2 text-sm text-slate-500">—</p>
          </div>
          <div id="usd-jpy-changes" class="grid grid-cols-2 gap-x-5 gap-y-3 text-sm"></div>
        </div>
      </article>
    </section>

    <section class="mt-5 grid gap-5 lg:grid-cols-2">
      <article class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4 shadow-xl sm:p-6">
        <div class="mb-4 flex items-center justify-between"><h2 class="text-lg font-semibold">金铜比趋势</h2><span class="text-sm text-slate-500">可拖动时间轴缩放</span></div>
        <div id="gold-copper-chart" class="h-[380px] w-full"></div>
      </article>
      <article class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4 shadow-xl sm:p-6">
        <div class="mb-4 flex items-center justify-between"><h2 class="text-lg font-semibold">美元兑日元趋势</h2><span class="text-sm text-slate-500">可拖动时间轴缩放</span></div>
        <div id="usd-jpy-chart" class="h-[380px] w-full"></div>
      </article>
    </section>
    <p id="error-message" class="mt-5 hidden rounded-lg bg-red-950/50 p-4 text-sm text-red-300"></p>
  </main>

  <script>
    const CHANGE_PERIODS = [
      { label: '日环比', days: 1 },
      { label: '周环比', days: 7 },
      { label: '月环比', months: 1 },
      { label: '年同比', years: 1 },
    ];

    function findReferencePoint(data, targetDate) {
      for (let index = data.length - 1; index >= 0; index -= 1) {
        if (data[index].date <= targetDate) return data[index];
      }
      return null;
    }

    function getTargetDate(latestDate, period) {
      const target = new Date(`${latestDate}T00:00:00Z`);
      if (period.days) target.setUTCDate(target.getUTCDate() - period.days);
      if (period.months) target.setUTCMonth(target.getUTCMonth() - period.months);
      if (period.years) target.setUTCFullYear(target.getUTCFullYear() - period.years);
      return target.toISOString().slice(0, 10);
    }

    function renderChanges(containerId, data) {
      const latest = data[data.length - 1];
      const container = document.getElementById(containerId);
      container.replaceChildren(...CHANGE_PERIODS.map(period => {
        const reference = findReferencePoint(data, getTargetDate(latest.date, period));
        const item = document.createElement('div');
        const label = document.createElement('p');
        label.className = 'text-xs text-slate-500';
        label.textContent = period.label;
        const value = document.createElement('p');
        value.className = 'mt-1 whitespace-nowrap font-semibold';
        if (!reference || reference.value === 0) {
          value.classList.add('text-slate-400');
          value.textContent = '—';
        } else {
          const absoluteChange = latest.value - reference.value;
          const percentChange = (absoluteChange / reference.value) * 100;
          value.classList.add(absoluteChange > 0 ? 'text-red-400' : absoluteChange < 0 ? 'text-emerald-400' : 'text-slate-400');
          value.textContent = `${absoluteChange >= 0 ? '+' : ''}${absoluteChange.toFixed(2)} (${percentChange >= 0 ? '+' : ''}${percentChange.toFixed(2)}%)`;
        }
        item.append(label, value);
        return item;
      }));
    }

    function renderChart(containerId, chartConfig, chartData) {
      const chart = echarts.init(document.getElementById(containerId));
      const dates = chartData.map(item => item.date);
      const series = chartConfig.series.map(item => ({
        name: item.name, type: 'line', smooth: true, showSymbol: false,
        data: chartData.map(row => row[item.field]),
        lineStyle: { width: 3, color: item.color }, itemStyle: { color: item.color },
        areaStyle: { color: item.area },
      }));
      chart.setOption({
        backgroundColor: 'transparent', tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
        legend: { textStyle: { color: '#cbd5e1' }, data: series.map(s => s.name) },
        grid: { left: 58, right: 24, top: 45, bottom: 72 },
        xAxis: { type: 'category', data: dates, boundaryGap: false, axisLabel: { color: '#94a3b8' }, axisLine: { lineStyle: { color: '#334155' } } },
        yAxis: { type: 'value', name: chartConfig.unit, axisLabel: { color: '#94a3b8' }, nameTextStyle: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
        dataZoom: [{ type: 'inside', start: 65, end: 100 }, { type: 'slider', start: 65, end: 100, height: 22, bottom: 15 }], series,
      });
      window.addEventListener('resize', () => chart.resize());
    }

    async function loadIndicator(id, file, chartConfig) {
      const response = await fetch(file, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${chartConfig.name}数据文件尚未生成，请先运行 Python 抓取脚本或等待 GitHub Actions 首次执行。`);
      const payload = await response.json();
      const latest = payload.latest;
      document.getElementById(`${id}-latest-value`).textContent = `${latest.value.toFixed(2)} ${payload.meta.unit}`;
      document.getElementById(`${id}-latest-date`).textContent = `交易日：${latest.date}`;
      renderChanges(`${id}-changes`, payload.data);
      renderChart(`${id}-chart`, { unit: payload.meta.unit, series: [{ name: chartConfig.name, field: 'value', color: chartConfig.color, area: chartConfig.area }] }, payload.data);
      return payload;
    }

    async function loadDashboard() {
      const error = document.getElementById('error-message');
      try {
        const [goldCopper] = await Promise.all([
          loadIndicator('gold-copper', './data/gold_copper_ratio.json', { name: '金铜比', color: '#fbbf24', area: 'rgba(251,191,36,.12)' }),
          loadIndicator('usd-jpy', './data/usd_jpy.json', { name: '美元兑日元', color: '#38bdf8', area: 'rgba(56,189,248,.12)' }),
        ]);
        document.getElementById('update-time').textContent = `数据更新时间（UTC）：${goldCopper.meta.updated_at.replace('T', ' ').replace('+00:00', '')}`;
      } catch (err) { error.textContent = err.message; error.classList.remove('hidden'); }
    }
    loadDashboard();
  </script>
</body>
</html>
