name: Daily macro data update

on:
  schedule:
    # 05:00 Beijing time (21:00 UTC). GitHub schedule runs in UTC.
    - cron: "00 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-macro-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --upgrade yfinance pandas pandas-datareader
      - name: Fetch and export indicators
        run: python fetch_data.py
      - name: Commit refreshed JSON when changed
        run: |
          if git diff --quiet -- docs/data; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "chore: update macro data"
          git push
